<body>

<nav class="navbar">
    <div class="logo">🏥 Bansal Hospital</div>

    <ul class="nav-links">

<div class="overlay">

    <section class="hero glass small-hero">
        <h1>Our Expert Doctors</h1>
        <p>Choose your specialist and book instantly.</p>

    <section class="doctor-grid" id="doctorGrid">

        <div class="card">
            <img src="https://randomuser.me/api/portraits/women/65.jpg">
            <h3>Dr. Shardha Bansal</h3>
            <p>Cardiologist</p>
            <button onclick="selectDoctor('Dr. Shardha','Cardiologist')">
                Book Now
            </button>
        </div>

        <div class="card">
            <img src="https://randomuser.me/api/portraits/men/52.jpg">
            <h3>Dr. Divansh Porwal</h3>
            <p>Orthopedic</p>
            <button onclick="selectDoctor('Dr. Divansh','Orthopedic')">
                Book Now
            </button>
        </div>

        <div class="card">
            <img src="https://randomuser.me/api/portraits/men/75.jpg">
            <h3>Dr. Deepraj Singh Chouhan</h3>
            <p>Dermatologist</p>
            <button onclick="selectDoctor('Dr. Deepraj','Dermatologist')">
                Book Now
            </button>
        </div>

    </section>

</div>
