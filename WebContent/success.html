<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Appointment Confirmed</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<div class="overlay">
    <div class="container">

        <div class="hero small-hero">
            <h1>✓ Appointment Confirmed</h1>
            <p>Your booking is successful</p>
        </div>

        <div class="card form-card">
            <div id="details"></div>
            <br>
            <button onclick="downloadPDF()">Download PDF</button>
            <button onclick="window.location='index.html'">Back Home</button>
        </div>

    </div>
</div>

<script src="js/script.js"></script>

<script>
let data = JSON.parse(localStorage.getItem("appointment"));

if(data){
document.getElementById("details").innerHTML = `
<p><b>Appointment ID:</b> ${data.id}</p>
<p><b>Patient:</b> ${data.name}</p>
<p><b>Doctor:</b> ${data.doctor}</p>
<p><b>Specialty:</b> ${data.specialty}</p>
<p><b>Date:</b> ${data.date}</p>
<p><b>Time:</b> ${data.time}</p>
<p><b>Payment:</b> ${data.payment}</p>
`;
}
</script>

</body>
</html>
